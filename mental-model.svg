<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowFb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9333ea"/>
    </marker>
    <style>
      .title  { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub    { font-size: 13px; fill: #64748b; }
      .box    { rx: 12; stroke-width: 1.5; }
      .htitle { font-size: 15px; font-weight: 700; }
      .lbl    { font-size: 12px; fill: #334155; }
      .file   { font-size: 11px; fill: #64748b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .edge   { font-size: 11px; fill: #475569; }
      .tag    { font-size: 10px; font-weight: 700; }
    </style>
  </defs>

  <rect width="960" height="660" fill="#f8fafc"/>
  <text x="40" y="46" class="title">🛡️ Ad Generation Pipeline — Mental Model</text>
  <text x="40" y="68" class="sub">One product idea → on-brand campaign variants → image, with a ChromaDB memory loop that recalls winners and learns from edits.</text>

  <!-- User -->
  <g>
    <rect x="40" y="100" width="170" height="70" class="box" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="125" y="132" text-anchor="middle" class="htitle" fill="#0369a1">👤 Marketer</text>
    <text x="125" y="152" text-anchor="middle" class="lbl">types an idea, edits, saves</text>
  </g>

  <!-- Streamlit UI -->
  <g>
    <rect x="40" y="210" width="280" height="170" class="box" fill="#ecfeff" stroke="#0891b2"/>
    <text x="60" y="238" class="htitle" fill="#0e7490">🎛️ Streamlit UI</text>
    <text x="60" y="256" class="file">app.py</text>
    <text x="60" y="284" class="lbl">• Sidebar: live Brand Profile</text>
    <text x="60" y="304" class="lbl">• Campaign size (1–5 variants)</text>
    <text x="60" y="324" class="lbl">• Image style preset</text>
    <text x="60" y="344" class="lbl">• Inline edit · Teach · Save · 🎨</text>
    <text x="60" y="366" class="file">brand.py · prompts.py (STYLE_PRESETS)</text>
  </g>

  <!-- Text generator -->
  <g>
    <rect x="380" y="120" width="250" height="120" class="box" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="400" y="148" class="htitle" fill="#4338ca">✍️ Text Generator</text>
    <text x="400" y="166" class="file">src/text_generator.py</text>
    <text x="400" y="192" class="lbl">Ollama (local llama3)</text>
    <text x="400" y="212" class="lbl">→ N distinct campaign variants</text>
    <text x="400" y="230" class="lbl">{headline, body}</text>
    <rect x="560" y="130" width="58" height="20" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="589" y="144" text-anchor="middle" class="tag" fill="#15803d">LOCAL</text>
  </g>

  <!-- Image generator -->
  <g>
    <rect x="380" y="280" width="250" height="120" class="box" fill="#fef3c7" stroke="#d97706"/>
    <text x="400" y="308" class="htitle" fill="#b45309">🎨 Image Generator</text>
    <text x="400" y="326" class="file">src/image_generator.py</text>
    <text x="400" y="352" class="lbl">Hugging Face Inference API</text>
    <text x="400" y="372" class="lbl">→ generated_ad_&lt;i&gt;.png</text>
    <rect x="556" y="290" width="62" height="20" rx="10" fill="#fee2e2" stroke="#dc2626"/>
    <text x="587" y="304" text-anchor="middle" class="tag" fill="#b91c1c">CLOUD</text>
  </g>

  <!-- Memory / feedback -->
  <g>
    <rect x="690" y="200" width="230" height="200" class="box" fill="#faf5ff" stroke="#9333ea"/>
    <text x="710" y="228" class="htitle" fill="#7e22ce">🧠 Memory Loop</text>
    <text x="710" y="246" class="file">src/feedback.py · ChromaDB</text>
    <rect x="710" y="262" width="190" height="58" rx="8" fill="#fff" stroke="#c4b5fd"/>
    <text x="722" y="282" class="lbl" font-weight="700">liked_ads</text>
    <text x="722" y="302" class="lbl">recall ads with a similar vibe</text>
    <rect x="710" y="328" width="190" height="58" rx="8" fill="#fff" stroke="#c4b5fd"/>
    <text x="722" y="348" class="lbl" font-weight="700">ad_edits</text>
    <text x="722" y="368" class="lbl">draft→edit pairs as few-shot</text>
  </g>

  <!-- Config -->
  <g>
    <rect x="40" y="430" width="280" height="70" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="60" y="458" class="htitle" fill="#475569">⚙️ Config</text>
    <text x="60" y="478" class="file">config.py → loads .env (HF_TOKEN)</text>
    <text x="60" y="494" class="lbl">Ollama URL · IMAGE_MODEL · CHROMA_PATH</text>
  </g>

  <!-- Edges -->
  <!-- user -> ui -->
  <line x1="125" y1="170" x2="125" y2="210" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- ui -> text gen -->
  <path d="M320 270 C 350 250, 360 200, 380 185" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="225" class="edge">idea + brand</text>
  <!-- text gen -> ui (variants back) -->
  <path d="M380 215 C 355 235, 345 270, 320 295" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="285" class="edge">variants</text>
  <!-- ui -> image gen -->
  <path d="M320 340 C 350 345, 355 340, 380 340" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="326" y="334" class="edge">edited copy</text>
  <!-- text gen -> image (prompt) -->
  <line x1="505" y1="240" x2="505" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="512" y="264" class="edge">image prompt</text>

  <!-- feedback edges (purple) -->
  <!-- ui save winner / teach -> memory -->
  <path d="M320 300 C 520 250, 600 270, 690 285" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowFb)"/>
  <text x="470" y="262" class="edge" fill="#7e22ce">save winner · teach from edits</text>
  <!-- memory -> text gen (few-shot) -->
  <path d="M690 300 C 660 250, 660 215, 630 190" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowFb)"/>
  <text x="612" y="150" class="edge" fill="#7e22ce">few-shot examples</text>
  <!-- memory -> ui (recall) -->
  <path d="M710 360 C 520 430, 420 360, 320 350" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowFb)"/>
  <text x="470" y="412" class="edge" fill="#7e22ce">similar past ads surface as you type</text>

  <!-- config feeds -->
  <line x1="200" y1="430" x2="430" y2="240" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 4"/>
  <line x1="260" y1="430" x2="470" y2="280" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- legend -->
  <g>
    <line x1="560" y1="470" x2="590" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="598" y="474" class="edge">generation flow</text>
    <line x1="560" y1="492" x2="590" y2="492" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowFb)"/>
    <text x="598" y="496" class="edge" fill="#7e22ce">memory / feedback loop</text>
  </g>
</svg>
